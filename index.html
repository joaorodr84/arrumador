<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arrumador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1><span class="logo">&#9638;</span> Arrumador</h1>
      <p id="level-name"></p>
    </header>

    <div id="hud">
      <div class="stat"><span>Nível</span><b><span id="level-num"></span>/<span id="level-total"></span></b></div>
      <div class="stat"><span>Movimentos</span><b id="moves">0</b></div>
      <div class="stat"><span>Recorde</span><b id="best">-</b></div>
    </div>

    <div id="stage">
      <canvas id="board" aria-label="Tabuleiro do jogo"></canvas>
      <div id="win" class="overlay hidden">
        <div class="card">
          <h2 id="win-title">Nível completo!</h2>
          <p id="win-text"></p>
          <div class="row">
            <button id="win-retry">Repetir</button>
            <button id="win-next" class="primary">Próximo &rarr;</button>
          </div>
        </div>
      </div>
    </div>

    <div id="controls">
      <button id="undo" title="Z">&#8630; Desfazer</button>
      <button id="restart" title="R">&#8635; Reiniciar</button>
      <button id="prev">&larr;</button>
      <button id="levels">Níveis</button>
      <button id="next">&rarr;</button>
      <button id="rules">Regras</button>
    </div>
    <p class="help">Setas / WASD para mover &middot; Z desfaz &middot; R reinicia</p>
  </main>

  <div id="rules-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="rules-title">
    <div class="card wide">
      <div class="row between">
        <h2 id="rules-title">Como jogar</h2>
        <div class="tabs">
          <button id="lang-pt" class="tab active">PT</button>
          <button id="lang-en" class="tab">EN</button>
        </div>
      </div>
      <ol id="rules-list"></ol>
      <div class="row end"><button class="primary" data-close>Entendi</button></div>
    </div>
  </div>

  <div id="levels-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Níveis">
    <div class="card wide">
      <h2>Níveis</h2>
      <div id="level-grid"></div>
      <div class="row end"><button data-close>Fechar</button></div>
    </div>
  </div>

  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
